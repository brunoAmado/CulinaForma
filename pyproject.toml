[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "culina-forma"
version = "1.9.0"
description = "CulinaForma™ (:4030 /api/culinaforma) — Interactive Three.js 3D Food & Multi-Tier Cake Design Studio, Arrhenius Q10 Sourdough Lab, Full 14 EU 1169/2011 Allergens, Locale-Ready Fiscal Engine, Printable ASAE Fichas & InsightFresco (:4029 /api/fresco) Bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
culina-forma = "culina_forma.server:main"
culina-forma-server = "culina_forma.server:main"
insight-bake = "insight_bake.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["culina_forma*", "insight_bake*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-bake"
version = "1.8.0"
description = "SetMiddle Insight™ · Bake (:4030) — Interactive Three.js 3D Multi-Tier Cake Configurator, Arrhenius Q10 Sourdough Lab, Full 14 EU 1169/2011 Allergens, Locale-Ready Fiscal Engine, Printable ASAE Fichas & InsightFresco (:4029 /api/fresco) Bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
insight-bake = "insight_bake.server:main"
